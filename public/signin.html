<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <title>Moovy - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="signin">
        <div class="container">
            <nav>
                <a href="index.html" class="signin-logo">
                    <img src="images/moovy-logo.png" alt="Moovy Logo" />
                </a>
            </nav>

            <main class="signin-main">
                <form class="container p-5 rounded shadow" style="max-width: 450px;">
                    <h2 class="mb-4 text-center">Sign in to your account</h2>

                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" id="email" name="email" placeholder="Email" />
                        <div class="alert alert-danger p-1 mt-2 d-none">
                            <small></small>
                        </div>
                        <label for="email">Email</label>
                    </div>

                    <div class="mb-4">
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" />
                            <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
                                <i class="fa-solid fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>  
                        <div class="alert alert-danger p-1 mt-2 d-none">
                            <small></small>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" />
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-decoration-none text-secondary">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-danger w-100">Sign In</button>

                    <!-- Sign Up Link -->
                    <p class="mt-4 text-center text-light-emphasis">
                        Don't have an account yet?
                        <a href="signup.html" class="text-primary text-decoration-underline">Sign up</a>
                    </p>
                </form>
            </main>
        </div>
    </div>

    <!-- Custom popup message -->
    <div id="popupMessage" class="position-fixed top-0 start-50 translate-middle-x alert d-none"
        style="z-index: 1055; margin-top: 1rem;"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/signin.js"></script>
</body>
</html>
