<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <title>Moovy - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="signup">
        <div class="container">
            <nav class="d-flex justify-content-between align-items-center">
                <a href="index.html" class="signup-logo">
                    <img src="images/moovy-logo.png" alt="Moovy Logo" />
                </a>
                <a href="signin.html" class="btn btn-danger">Sign In</a>
            </nav>

            <main class="signup-main">
                <section class="mb-4 text-center">
                    <h1>Unlimited movies, TV shows, and more</h1>
                    <h5>Your favorite movie streaming platform</h5>
                </section>

                <form class="container" style="max-width: 450px;">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" />
                        <div class="alert alert-danger p-1 mt-2 d-none">
                            <small></small>
                        </div>
                        <label for="username">User Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="email" name="email" placeholder="Email" />
                        <div class="alert alert-danger p-1 mt-2 d-none">
                            <small></small>
                        </div>
                        <label for="email">Email</label>
                    </div>

                    <div class="mb-3">
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" />
                            <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
                                <i class="fa-solid fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>  
                        <div class="alert alert-danger p-1 mt-2 d-none">
                            <small></small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">Sign Up</button>
                </form>
            </main>
        </div>
    </div>

    <!-- Custom popup message -->
    <div id="popupMessage" class="position-fixed top-0 start-50 translate-middle-x alert d-none"
        style="z-index: 1055; margin-top: 1rem;"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
