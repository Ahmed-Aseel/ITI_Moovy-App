<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <title>Moovy - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="home">
        <div class="container">
            <nav id="mainNav" class="navbar navbar-expand-lg fixed-top py-3">
                <div class="container">
                    <a href="index.html" class="navbar-brand d-flex align-items-center">
                        <img src="images/moovy-logo.png" alt="Moovy Logo" style="height: 40px;" />
                    </a>

                    <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarContent">
                        <!-- Navigation links -->
                        <ul class="navbar-nav nav-links me-auto mb-2 mb-lg-0 d-flex gap-lg-3">
                            <li class="nav-item">
                                <a class="nav-link text-white" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="#trending">Movies</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="#tvSeries">TV Series</a>
                            </li>
                        </ul>

                        <div class="d-flex gap-2 mt-2 mt-lg-0">
                            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search..."
                                style="max-width: 200px;" autocomplete="off" />
                            <button id="signoutBtn" class="btn btn-danger btn-sm">Signout</button>
                        </div>
                    </div>
                </div>
            </nav>

            <main class="home-main">
                <section id="trending" class="mb-5">
                    <h2 class="mb-3">Trending</h2>
                    <div class="scroll-container" id="trendingList"></div>
                </section>
                <section id="topRated" class="mb-5">
                    <h2 class="mb-3">Top Rated</h2>
                    <div class="scroll-container" id="topRatedList"></div>
                </section>
                <section id="tvSeries" class="mb-5">
                    <h2 class="mb-3">Tv Series</h2>
                    <div class="scroll-container" id="tvSeriesList"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Custom popup message -->
    <div id="popupMessage" class="position-fixed top-0 start-50 translate-middle-x alert d-none"
        style="z-index: 1055; margin-top: 1rem;"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
